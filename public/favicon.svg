<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18201B"/>
      <stop offset="100%" stop-color="#0E1310"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- Squircle Base with Neumorphic Dark Tint -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="2.5"/>
  
  <!-- Terminal Chevron < in Terracotta -->
  <path d="M18 32 L26 24 M18 32 L26 40" stroke="#EA580C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Letter R in Crisp White -->
  <text x="32" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">R</text>
  
  <!-- Terminal Chevron / Close > in Emerald -->
  <path d="M46 32 L38 24 M46 32 L38 40" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Active System Status Radar Dot -->
  <circle cx="50" cy="14" r="3.5" fill="#10B981"/>
  <circle cx="50" cy="14" r="5.5" fill="#10B981" opacity="0.4"/>
</svg>
